app = "mira-ai-museum-guide"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[[mounts]]
  source = "mira_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
